{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — PAD Décisionnel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'dashboard/css/pad.css' %}" rel="stylesheet">
</head>
<body>
<div class="error-page" style="background:var(--pad-bg);min-height:100vh;">
  <div class="error-code">500</div>
  <img src="{% static 'dashboard/img/pad_logo.jpg' %}" alt="PAD" style="width:80px;border-radius:12px;margin-bottom:1rem;opacity:.7;">
  <div class="error-msg">Erreur interne du serveur</div>
  <div class="error-sub">Une erreur inattendue s'est produite. L'équipe technique a été notifiée.</div>
  <a href="/" class="btn btn-primary mt-4" style="background:var(--pad-blue);border:none;border-radius:10px;padding:.6rem 1.5rem;font-weight:600;">
    <i class="bi bi-arrow-clockwise me-2"></i>Réessayer
  </a>
</div>
</body>
</html>
