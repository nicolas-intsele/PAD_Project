{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — PAD Décisionnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'dashboard/css/pad.css' %}" rel="stylesheet">
</head>
<body>

<!-- Logo PAD en fond transparent derrière tout -->
<div class="login-bg-logo" style="background-image:url('{% static 'dashboard/img/pad_logo.jpg' %}');"></div>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="{% static 'dashboard/img/pad_logo.jpg' %}" alt="Port Autonome de Douala" class="login-logo-img">
      <h1>PAD Décisionnel</h1>
      <p>Port Autonome de Douala — Analyse des opérations navires</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 mb-3" style="font-size:.85rem;border-radius:10px;">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        Identifiant ou mot de passe incorrect.
      </div>
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label for="id_username" class="form-label">Identifiant</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#d1d9e0;">
            <i class="bi bi-person-fill text-muted"></i>
          </span>
          <input type="text" name="username" id="id_username"
                 class="form-control" placeholder="Votre identifiant" autofocus
                 style="border-radius:0 10px 10px 0;">
        </div>
      </div>

      <div class="mb-4">
        <label for="id_password" class="form-label">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px;border-color:#d1d9e0;">
            <i class="bi bi-lock-fill text-muted"></i>
          </span>
          <input type="password" name="password" id="pwdField"
                 class="form-control" placeholder="••••••••"
                 style="border-radius:0 10px 10px 0;">
          <span class="input-group-text" style="border-radius:0 10px 10px 0;border-color:#d1d9e0;cursor:pointer;"
                onclick="var f=document.getElementById('pwdField');f.type=f.type==='password'?'text':'password';this.querySelector('i').className=f.type==='password'?'bi bi-eye':'bi bi-eye-slash'">
            <i class="bi bi-eye text-muted"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
      </button>
    </form>

    <div class="login-footer">
      <i class="bi bi-shield-lock me-1"></i>Accès réservé au personnel autorisé du PAD<br>
      <span style="font-size:.72rem;">© {{ year }} Port Autonome de Douala</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
