{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — PAD Décisionnel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'dashboard/css/pad.css' %}" rel="stylesheet">
</head>
<body>
<div class="error-page" style="background:var(--pad-bg);min-height:100vh;">
  <div class="error-code">404</div>
  <img src="{% static 'dashboard/img/pad_logo.jpg' %}" alt="PAD" style="width:80px;border-radius:12px;margin-bottom:1rem;opacity:.7;">
  <div class="error-msg">Page introuvable</div>
  <div class="error-sub">La page que vous cherchez n'existe pas ou a été déplacée.</div>
  <a href="/" class="btn btn-primary mt-4" style="background:var(--pad-blue);border:none;border-radius:10px;padding:.6rem 1.5rem;font-weight:600;">
    <i class="bi bi-house me-2"></i>Retour à l'accueil
  </a>
</div>
</body>
</html>
